<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stream Deck Pro</title>
  <style>
    * {
      -webkit-box-sizing: border-box;
      -moz-box-sizing: border-box;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: rgba(0,0,0,0);
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0d1117;
      color: #f0f6fc;
      font-family: Arial, Helvetica, sans-serif;
      padding: 8px;
      text-align: center;
    }
    
    /* Header compatible con Android 4.0 */
    .header {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 12px;
      overflow: hidden;
      font-size: 14px;
    }
    .header-left {
      float: left;
      font-weight: bold;
      color: #58a6ff;
      line-height: 24px;
    }
    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 5px;
      background: #2ea043;
      margin-right: 6px;
      vertical-align: middle;
    }
    .header-right {
      float: right;
      line-height: 24px;
    }
    .badge {
      display: inline-block;
      background: #21262d;
      border: 1px solid #30363d;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 6px;
      font-size: 12px;
    }
    .badge-val {
      color: #3fb950;
      font-weight: bold;
    }

    /* Grilla 100% compatible con WebKit antiguo (sin CSS Grid) */
    .deck-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
      font-size: 0; /* Elimina espacio blanco de inline-block */
    }
    .deck-btn {
      display: inline-block;
      vertical-align: top;
      width: 23%;
      margin: 1%;
      height: 88px;
      background: #161b22;
      border: 2px solid #30363d;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      font-size: 12px;
      position: relative;
      padding-top: 12px;
      -webkit-box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
    }
    .deck-btn:active, .deck-btn.pressed {
      background: #1f6feb !important;
      border-color: #58a6ff !important;
      -webkit-transform: scale(0.95);
      transform: scale(0.95);
    }
    .deck-btn svg {
      display: block;
      margin: 0 auto 6px auto;
      width: 28px;
      height: 28px;
      fill: none;
      stroke: #f0f6fc;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .deck-btn .label {
      display: block;
      color: #c9d1d9;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.3px;
    }

    /* Colores por categorias */
    .btn-green { border-color: #238636; }
    .btn-green svg { stroke: #3fb950; fill: #3fb950; }
    .btn-green .stroke-only { fill: none; }

    .btn-blue { border-color: #1f6feb; }
    .btn-blue svg { stroke: #58a6ff; }

    .btn-purple { border-color: #8957e5; }
    .btn-purple svg { stroke: #bc8cff; }

    .btn-red { border-color: #da3633; }
    .btn-red svg { stroke: #f85149; }
  </style>
</head>
<body>

  <!-- Barra de estado -->
  <div class="header">
    <div class="header-left">
      <span class="status-dot" id="status-dot"></span>
      Stream Deck
    </div>
    <div class="header-right">
      <div class="badge">CPU: <span class="badge-val" id="cpu-val">--%</span></div>
      <div class="badge">RAM: <span class="badge-val" id="ram-val">--%</span></div>
    </div>
  </div>

  <!-- Botonera -->
  <div class="deck-container">
    
    <!-- FILA 1: MULTIMEDIA -->
    <div class="deck-btn btn-green" data-action="prev_track">
      <svg viewBox="0 0 24 24"><polygon points="11,5 11,19 2,12"/><polygon points="22,5 22,19 13,12"/></svg>
      <span class="label">Anterior</span>
    </div>

    <div class="deck-btn btn-green" data-action="play_pause">
      <svg viewBox="0 0 24 24"><polygon points="5,3 15,12 5,21"/><rect x="17" y="4" width="4" height="16"/></svg>
      <span class="label">Play / Pausa</span>
    </div>

    <div class="deck-btn btn-green" data-action="next_track">
      <svg viewBox="0 0 24 24"><polygon points="2,5 2,19 11,12"/><polygon points="13,5 13,19 22,12"/></svg>
      <span class="label">Siguiente</span>
    </div>

    <div class="deck-btn btn-red" data-action="vol_mute">
      <svg viewBox="0 0 24 24" class="stroke-only"><polygon points="11,4 6,8 2,8 2,16 6,16 11,20"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
      <span class="label">Mutear</span>
    </div>

    <!-- FILA 2: VOLUMEN & SISTEMA -->
    <div class="deck-btn btn-green" data-action="vol_down">
      <svg viewBox="0 0 24 24" class="stroke-only"><polygon points="11,4 6,8 2,8 2,16 6,16 11,20"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
      <span class="label">Volumen -</span>
    </div>

    <div class="deck-btn btn-green" data-action="vol_up">
      <svg viewBox="0 0 24 24" class="stroke-only"><polygon points="11,4 6,8 2,8 2,16 6,16 11,20"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
      <span class="label">Volumen +</span>
    </div>

    <div class="deck-btn btn-purple" data-action="desktop">
      <svg viewBox="0 0 24 24" class="stroke-only"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span class="label">Escritorio</span>
    </div>

    <div class="deck-btn btn-red" data-action="lock_pc">
      <svg viewBox="0 0 24 24" class="stroke-only"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span class="label">Bloquear PC</span>
    </div>

    <!-- FILA 3: DESARROLLO & APPS -->
    <div class="deck-btn btn-blue" data-action="open_code">
      <svg viewBox="0 0 24 24" class="stroke-only"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      <span class="label">VS Code</span>
    </div>

    <div class="deck-btn btn-blue" data-action="open_terminal">
      <svg viewBox="0 0 24 24" class="stroke-only"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      <span class="label">Terminal</span>
    </div>

    <div class="deck-btn btn-blue" data-action="open_browser">
      <svg viewBox="0 0 24 24" class="stroke-only"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span class="label">Localhost</span>
    </div>

    <div class="deck-btn btn-purple" data-action="open_calc">
      <svg viewBox="0 0 24 24" class="stroke-only"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="18"/><line x1="8" y1="12" x2="8" y2="12.01"/><line x1="12" y1="12" x2="12" y2="12.01"/><line x1="16" y1="12" x2="16" y2="12.01"/><line x1="8" y1="16" x2="8" y2="16.01"/><line x1="12" y1="16" x2="12" y2="16.01"/></svg>
      <span class="label">Calculadora</span>
    </div>

  </div>

  <script>
    // Manejo tactil instantaneo para Android 4.0
    var buttons = document.getElementsByClassName('deck-btn');
    for (var i = 0; i < buttons.length; i++) {
      (function(btn) {
        var action = btn.getAttribute('data-action');
        
        function trigger() {
          btn.className += ' pressed';
          setTimeout(function() {
            btn.className = btn.className.replace(' pressed', '');
          }, 120);

          var xhr = new XMLHttpRequest();
          xhr.open('POST', '/api/action', true);
          xhr.setRequestHeader('Content-Type', 'application/json');
          xhr.send(JSON.stringify({ action: action }));
        }

        btn.onclick = trigger;
      })(buttons[i]);
    }

    // Telemetria
    function updateStats() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', '/api/stats', true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          var dot = document.getElementById('status-dot');
          if (xhr.status === 200) {
            try {
              var data = JSON.parse(xhr.responseText);
              document.getElementById('cpu-val').innerHTML = data.cpu + '%';
              document.getElementById('ram-val').innerHTML = data.ram + '%';
              dot.style.background = '#2ea043';
            } catch(e) {}
          } else {
            dot.style.background = '#da3633';
          }
        }
      };
      xhr.send();
    }

    setInterval(updateStats, 3000);
    updateStats();
  </script>
</body>
</html>
